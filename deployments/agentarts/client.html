<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Embedded Engineer · AgentArts 适配预览</title><style>
[hidden]{display:none!important}body{font:16px/1.65 system-ui,sans-serif;background:#f4f7f6;color:#14352f;margin:0}main{max-width:940px;margin:36px auto;padding:0 24px}section{background:white;border:1px solid #dce7e2;border-radius:14px;padding:24px;margin:20px 0}textarea,input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bdcfc7;border-radius:8px;font:inherit;margin:8px 0}button{padding:10px 18px;border:0;border-radius:8px;background:#176a51;color:white;font:inherit;cursor:pointer;margin:5px}button:disabled{opacity:.5;cursor:default}.muted{color:#687b74}.notice{padding:12px;background:#edf4e6;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f5;padding:16px}h1{font-size:30px}h2{font-size:21px}label{display:block}small{display:block}#message{min-height:1.6em}a{color:#176a51}
</style><script src="./client.js" defer></script></head><body><main><h1>Embedded Engineer</h1><p>AgentArts 部署适配预览 · 独立于本地完整工作台</p><p class="notice">此版支持需求分析、资料工具与文档交付。Keil、USB和源码执行需本地执行端，当前未接入。未配置模型时会明确等待，不生成模拟答案。</p>
<section><h2>描述你的项目</h2><textarea id="description" rows="4" placeholder="例如：设计电池供电的环境监测设备，先交付设计说明，预算和续航尚未确定。"></textarea><button id="start">创建并开始分析</button><button id="resume">继续已有会话</button><button id="stop">停止后续推进</button><label>会话标识<input id="session" maxlength="64"></label><small class="muted">恢复需保留相同会话标识和运行编号；新会话相互隔离。此预览不代表已部署云端。</small><label>运行编号<input id="run"></label><label>可选应用访问令牌（仅内存，不保存）<input id="token" type="password" autocomplete="off"></label></section>
<p id="message" role="status"></p><section id="project-panel" hidden><h2 id="title"></h2><p id="scope" class="muted"></p><div id="requirements"></div><div id="questions"></div><button id="confirm">确认这些需求并继续</button><div id="candidates"></div><label id="reply-label">回答 Agent 的问题<textarea id="reply" rows="3"></textarea><button id="send">发送并继续</button></label><label>补充或修改需求<textarea id="supplement" rows="2"></textarea></label><button id="amend">提交修改并重新分析</button><button id="continue">继续推进</button><button id="status">刷新状态</button><button id="download">下载文档包</button><details><summary>查看执行记录</summary><pre id="trace"></pre></details></section><p class="muted">原本地工作台仍使用 8765 端口和原数据。此入口使用独立配置、会话与端口。</p></main></body></html>
