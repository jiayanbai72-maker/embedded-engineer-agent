[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-engineer-agent"
version = "0.1.0"
description = "Platform-independent embedded engineering workflow skeleton"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = ["pyserial==3.5"]
pdf = ["pypdf>=5,<7", "pdfplumber>=0.11,<0.12"]
test = ["reportlab>=4,<5", "pypdf>=5,<7", "pdfplumber>=0.11,<0.12"]

[project.scripts]
embedded-agent = "embedded_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embedded_agent = ["web/*.html", "web/*.js", "web/*.css"]
