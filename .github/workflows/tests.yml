name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src;tests
  online-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest test_online_gateway test_analysis_quality test_analysis_quality_integration test_model_context test_prompt_layout test_readiness
        env:
          PYTHONPATH: src:tests
